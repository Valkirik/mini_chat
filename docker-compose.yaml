version: "3.10"
services:

  db:
    container_name: task_db
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - 5432
    ports:
      - "5432:5432"
    env_file:
      - .env

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
  web:
    container_name: backend
    restart: always
    build:
      context: ././
      dockerfile: dockerfile
    command: >
      sh -lc "cd backend && python manage.py migrate && daphne -b 0.0.0.0. -p 8000 config.asgi:application"
    expose:
      - 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data: